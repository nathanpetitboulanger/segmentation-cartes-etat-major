[project]
name = "segmentation-cartes-etat-major"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.2.0",
    "ipython>=9.18.0",
    "pyarrow>=26.0.0",
    "pyogrio>=0.13.0",
    "rasterio>=1.5.2",
    "torch>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12"]
build-backend = "uv_build"

[tool.pyright]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "plotly>=7.1.0",
]
